[package]
name = "qemu-command-builder"
version = "11.2.0-rc0"
edition = "2024"
authors = ["Adam Flott <adam@adamflott.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/adamflott/qemu-command-builder"
keywords = ["qemu"]
description = "Type safe command line builder for qemu"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
annotate-snippets = "0.12.18"
bon = "3.10.3"
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
ipnet = "2.12.2"
newtype-uuid = { version = "1.4.0", features = ["proptest1", "v4"]}
proptest = "1.12.0"
proptest-derive = "0.9.0"
shellish_parse = "2.2.0"
winnow = "1.0.5"

[dev-dependencies]
pretty_assertions = "1.4.1"

[[bin]]
name = "parse_qemu_command"
path = "src/bin/parse_qemu_command.rs"
